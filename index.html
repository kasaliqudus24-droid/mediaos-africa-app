<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaOS Africa Newsroom HQ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar hiding for native mobile feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Mobile phone mockup wrapper */
        .phone-frame {
            max-width: 412px;
            height: 870px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border-radius: 48px;
            border: 12px solid #1f2937;
        }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 font-sans">

    <!-- Mobile Device Container -->
    <div class="phone-frame w-full bg-white relative overflow-hidden flex flex-col">
        
        <!-- Status Bar -->
        <div class="bg-[#0b532c] text-white px-8 pt-3 pb-1 flex justify-between items-center text-xs font-semibold z-20">
            <span>9:45</span>
            <div class="w-20 h-4 bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
            <div class="flex items-center space-x-1.5">
                <i data-lucide="signal" class="w-3.5 h-3.5"></i>
                <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
                <i data-lucide="battery" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- Header Section -->
        <header class="bg-[#0b532c] text-white pt-6 pb-12 px-6 rounded-b-[32px] relative z-10 text-center shadow-md">
            <!-- Africa Logo Graphic -->
            <div class="flex justify-center mb-3">
                <div class="w-16 h-16 bg-[#e2b02a] rounded-full flex items-center justify-center shadow-inner relative overflow-hidden">
                    <!-- Stylized Africa map shape representation -->
                    <i data-lucide="globe-2" class="w-10 h-10 text-[#0b532c]"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">MediaOS Africa</h1>
            <h2 class="text-2xl font-bold tracking-wide opacity-90">Newsroom HQ</h2>
        </header>

        <!-- Main Content View Container -->
        <main id="main-view" class="flex-1 overflow-y-auto px-5 -mt-6 pb-20 pt-2 z-10 space-y-3.5 no-scrollbar">
            
            <!-- Dashboard Menu List -->
            
            <!-- Card 1: Crisis Alerts (Amber / High Priority) -->
            <div onclick="openModule('Crisis Alerts', 'amber')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition active:scale-[0.98]">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-[#f9a825] text-white rounded-full flex items-center justify-center shadow-sm">
                        <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">Crisis Alerts</h3>
                        <p class="text-xs text-slate-400 font-medium">@Alerts & Rapid Dispatch</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
            </div>

            <!-- Card 2: Crisis Safety Channels -->
            <div onclick="openModule('Crisis Safety Channels', 'green')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition active:scale-[0.98]">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-[#2e7d32] text-white rounded-full flex items-center justify-center shadow-sm">
                        <i data-lucide="shield-alert" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">Crisis Verification</h3>
                        <p class="text-xs text-slate-400 font-medium">@Safety Channels</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
            </div>

            <!-- Card 3: Story Requests -->
            <div onclick="openModule('Story Requests (Swap Sunday)', 'blue')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition active:scale-[0.98]">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-[#0288d1] text-white rounded-full flex items-center justify-center shadow-sm">
                        <i data-lucide="newspaper" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">Story Requests</h3>
                        <p class="text-xs text-slate-400 font-medium">@Swap Sunday Desk</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
            </div>

            <!-- Card 4: Fellowships -->
            <div onclick="openModule('Fellowships & Exchanges', 'emerald')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition active:scale-[0.98]">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-[#00897b] text-white rounded-full flex items-center justify-center shadow-sm">
                        <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">Fellowships</h3>
                        <p class="text-xs text-slate-400 font-medium">@Grants, Work & Exchanges</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
            </div>

            <!-- Card 5: Active Projects -->
            <div onclick="openModule('Active Projects (NSA-ICF)', 'indigo')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition active:scale-[0.98]">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-[#3949ab] text-white rounded-full flex items-center justify-center shadow-sm">
                        <i data-lucide="folder-kanban" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">Active Projects</h3>
                        <p class="text-xs text-slate-400 font-medium">@Pipeline & Collaborative Investigations</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i>
            </div>

        </main>

        <!-- Dynamic Module Modal Layer -->
        <div id="module-modal" class="absolute inset-0 bg-white z-30 transform translate-y-full transition-transform duration-300 flex flex-col">
            <div class="p-4 bg-slate-800 text-white flex items-center justify-between shadow-md">
                <button onclick="closeModule()" class="flex items-center space-x-1 text-sm bg-slate-700 px-3 py-1.5 rounded-lg">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Back</span>
                </button>
                <h3 id="modal-title" class="font-bold text-base">Module Details</h3>
                <div class="w-12"></div>
            </div>
            <div id="modal-body" class="p-5 overflow-y-auto flex-1 space-y-4 no-scrollbar">
                <!-- Content inserted dynamically -->
            </div>
        </div>

        <!-- Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-100 py-2.5 px-6 flex justify-between items-center text-slate-400 text-[10px] font-medium z-20">
            <button class="flex flex-col items-center space-y-1 text-[#0b532c]">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span>Home</span>
            </button>
            <button class="flex flex-col items-center space-y-1 hover:text-slate-600">
                <i data-lucide="layers" class="w-5 h-5"></i>
                <span>All Lines</span>
            </button>
            <button class="flex flex-col items-center space-y-1 hover:text-slate-600">
                <i data-lucide="badge-dollar-sign" class="w-5 h-5"></i>
                <span>Finances</span>
            </button>
            <button class="flex flex-col items-center space-y-1 hover:text-slate-600">
                <i data-lucide="archive" class="w-5 h-5"></i>
                <span>Archive</span>
            </button>
            <button class="flex flex-col items-center space-y-1 hover:text-slate-600">
                <i data-lucide="user-check" class="w-5 h-5"></i>
                <span>About</span>
            </button>
        </nav>

        <!-- Home Indicator Bar -->
        <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-300 rounded-full z-30"></div>
    </div>

    <!-- Interactive Script -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Sample dynamic data for modules
        const moduleContent = {
            'Crisis Alerts': `
                <div class="bg-amber-50 border-l-4 border-amber-500 p-3 rounded-r-lg">
                    <span class="text-xs font-bold uppercase text-amber-600">Amber Alert Active</span>
                    <h4 class="font-bold text-slate-800 text-sm mt-1">Unverified Video Context Alert</h4>
                    <p class="text-xs text-slate-600 mt-1">Johannesburg Suburb Incidents – Ground desk dispatching verification team.</p>
                </div>
                <div class="space-y-2">
                    <h5 class="text-xs font-bold uppercase text-slate-400">Actions</h5>
                    <button class="w-full bg-[#0b532c] text-white py-2.5 rounded-xl font-semibold text-xs flex items-center justify-center space-x-2">
                        <i data-lucide="send" class="w-4 h-4"></i>
                        <span>Dispatch Ground Reporter</span>
                    </button>
                    <button class="w-full border border-slate-200 text-slate-700 py-2.5 rounded-xl font-semibold text-xs flex items-center justify-center space-x-2">
                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                        <span>Submit OSINT Fact-Check</span>
                    </button>
                </div>
            `,
            'Crisis Safety Channels': `
                <div class="space-y-3">
                    <div class="p-3 bg-slate-50 border rounded-xl">
                        <h4 class="font-bold text-sm text-slate-800">24/7 Field Verification Hotline</h4>
                        <p class="text-xs text-slate-500 mt-1">Direct line to Lagos & Joburg security liaison desks.</p>
                    </div>
                    <div class="p-3 bg-slate-50 border rounded-xl">
                        <h4 class="font-bold text-sm text-slate-800">Legal Risk Screening</h4>
                        <p class="text-xs text-slate-500 mt-1">Pre-publication libel check for cross-border leaks.</p>
                    </div>
                </div>
            `,
            'Story Requests (Swap Sunday)': `
                <div class="space-y-3">
                    <div class="border p-3 rounded-xl">
                        <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-bold">STORY PENDING</span>
                        <h4 class="font-bold text-sm text-slate-800 mt-1">Tech Hub Inflows: Lagos to Joburg</h4>
                        <p class="text-xs text-slate-500 mt-0.5">Submitted by Nigerian Tribune • Context note required.</p>
                    </div>
                    <button class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-semibold text-xs">
                        + Pitch New Swap Sunday Story
                    </button>
                </div>
            `,
            'Fellowships & Exchanges': `
                <div class="space-y-3">
                    <div class="p-3 bg-teal-50 border border-teal-100 rounded-xl">
                        <h4 class="font-bold text-sm text-teal-900">30-Day Newsroom Exchange Cohort</h4>
                        <p class="text-xs text-teal-700 mt-1">Applications open for Q3 Cross-Border Residency.</p>
                    </div>
                </div>
            `,
            'Active Projects (NSA-ICF)': `
                <div class="space-y-3">
                    <div class="p-3 border rounded-xl">
                        <h4 class="font-bold text-sm text-slate-800">Illicit Financial Flows Pipeline</h4>
                        <p class="text-xs text-slate-500 mt-1">Grant: $15,000 • Status: Phase 2 OSINT Cross-Check</p>
                    </div>
                </div>
            `
        };

        function openModule(title, theme) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = moduleContent[title] || '<p class="text-slate-500 text-sm">Module content loading...</p>';
            document.getElementById('module-modal').classList.remove('translate-y-full');
            lucide.createIcons();
        }

        function closeModule() {
            document.getElementById('module-modal').classList.add('translate-y-full');
        }
    </script>
</body>
</html>
